# tvpc launcher — fuzzel, sized for a TV and driven by the remote's
# arrow keys plus OK. Escape closes it.
#
# fuzzel takes the layer-shell namespace "launcher", which is what the
# blur-launcher layer rule in hyprland.lua matches.

font=Noto Sans:size=20
dpi-aware=no
prompt=">  "
icon-theme=breeze-dark
icons-enabled=yes
fields=name,generic,categories
terminal=foot -e
lines=8
width=42
horizontal-pad=40
vertical-pad=28
inner-pad=14
line-height=42
layer=overlay

[colors]
background=0b0e14e6
text=e6edf3ff
match=33ccffff
selection=33ccff33
selection-text=ffffffff
selection-match=00ff99ff
border=33ccffcc

[border]
width=2
radius=16
