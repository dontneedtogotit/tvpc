# Intel Broadwell (NUC7i5BNH) GPU config
# Enable tear-free rendering for plasma-mobile Wayland via XWayland
Section "Device"
    Identifier "Intel Graphics"
    Driver "intel"
    Option "TearFree" "true"
    Option "DRI" "3"
    Option "AccelMethod" "sna"
EndSection

Section "Screen"
    Identifier "TV Screen"
    Monitor "Samsung-2013"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "800x600"
    EndSubSection
EndSection

Section "Monitor"
    Identifier "Samsung-2013"
    # 2013 Samsung TVs report 4K but can be finicky — force 1080p
    Modeline "1920x1080_60.00"  148.50  1920 2008 2052 2200  1080 1084 1089 1125  +HSync -VSync
EndSection