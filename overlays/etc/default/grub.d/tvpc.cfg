# NUC7i5BNH Broadwell GRUB tweaks
# i915.enable_guc=2   — enable GuC/HuC firmware for VA-API hardware decode
# intel_iommu=igfx_off — disable IOMMU for GPU to avoid instability on Broadwell
# Note: zswap is DISABLED via install.sh to avoid conflict with zram swap
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash i915.enable_guc=2 intel_iommu=igfx_off"