# NUC7i5BNH — Intel Core i5-7260U "Kaby Lake" (gen9), Iris Plus Graphics 640.
# (Earlier revisions of this file called it Broadwell. It is not, and the
# parameters that were chosen for "Broadwell" are what this file now drops.)
#
# Deliberately minimal. Every extra i915/IOMMU parameter is another chance to
# lose the display before anything can tell you why.
#
#   no "splash"              plymouth covering a session that failed to start
#                            is exactly what turns a broken boot into a black
#                            screen with a cursor. Without it you see the boot
#                            log, and Ctrl+Alt+F3 still reaches a TTY.
#   no "i915.enable_guc=2"   GuC/HuC submission is not used on gen9 by default
#                            and VA-API decode does not need it. The driver
#                            default (-1, auto) is correct for Kaby Lake.
#   no "intel_iommu=igfx_off" a workaround for pre-Broadwell integrated GPUs;
#                            on Kaby Lake it buys nothing.
GRUB_CMDLINE_LINUX_DEFAULT="quiet"

# Only if the TV's EDID is genuinely unusable: force the mode at the KMS level
# rather than with an Xorg Modeline. Get the connector name from
# `ls /sys/class/drm/` (usually card1-HDMI-A-1 -> HDMI-A-1) and use:
#   GRUB_CMDLINE_LINUX_DEFAULT="quiet video=HDMI-A-1:1920x1080@60"

# Keep the boot menu reachable. An appliance you cannot get into is a brick,
# and recovery mode is the escape hatch when the graphical session misbehaves.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=3
