# iHD is the VA-API driver for Kaby Lake (gen9). Without this, libva can pick
# the older i965 driver and lose hardware decode entrypoints.
LIBVA_DRIVER_NAME=iHD
# ydotool's client talks to ydotoold over this socket; see enhance-cec.sh.
YDOTOOL_SOCKET=/run/ydotoold/socket
# Enable client/server window decorations on Wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=0
