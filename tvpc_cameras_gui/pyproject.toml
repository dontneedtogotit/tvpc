[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tvpc-cameras-gui"
version = "1.0.0"
description = "PySide6 GUI for IP security cameras with network auto-discovery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "tvpc" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Networking",
]
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
]

[project.scripts]
tvpc-cameras-gui = "tvpc_cameras_gui.__main__:main"

[project.gui-scripts]
tvpc-cameras-gui = "tvpc_cameras_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/dontneedtogotit/tvpc"
"Bug Tracker" = "https://github.com/dontneedtogotit/tvpc/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tvpc_cameras_gui*"]

[tool.setuptools.package-data]
tvpc_cameras_gui = ["py.typed"]
